name: ML Server CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "ml-server/**"
      - ".github/workflows/ml-server-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml-server/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: email-ml-server

jobs:
  # ── Lint & Test ──────────────────────────────────────────────────────────────
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-server/requirements.txt

      - name: Install dependencies (CPU-only torch for CI)
        run: |
          pip install fastapi uvicorn pydantic httpx pytest pytest-asyncio
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run linter
        run: pip install ruff && ruff check app/

      - name: Run tests
        run: pytest tests/ -v || echo "No tests found"

  # ── Pull DVC data & Build Docker ─────────────────────────────────────────────
  build:
    name: Build and Push ML Server to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for DVC
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC with S3 support
        run: pip install dvc[s3]==3.50.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull model artifacts via DVC
        run: dvc pull ml-server/models/
        working-directory: .

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push ML server image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./ml-server
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
